services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Local dev only — reads from .env if set, otherwise falls back to
      # these placeholder defaults. Never point this at a real database.
      POSTGRES_USER: ${POSTGRES_USER:-womp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-womp_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-womp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
